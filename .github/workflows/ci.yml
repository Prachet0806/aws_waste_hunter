name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --cov --cov-branch --cov-report=term-missing --cov-fail-under=80
      - run: python -m pip install cfn-lint pip-audit ruff
      - run: ruff check . --select E9,F63,F7,F82
      - run: cfn-lint infra/template.yaml
      - run: pip-audit -r requirements.lock
      - uses: aws-actions/setup-sam@v2
      - run: sam validate --lint --template-file infra/template.yaml
      - run: sam build --use-container --template-file infra/template.yaml
      - run: python scripts/validate_artifact.py .aws-sam/build/FinalizerFunction
